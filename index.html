    <script>
      // Polyfill window.fetch setter so browser extensions and automation executors can wrap fetch without throwing
      (function() {
        try {
          var _orig = window.fetch;
          var _active = _orig ? _orig.bind(window) : undefined;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return _active;
            },
            set: function(fn) {
              _active = fn;
            }
          });
        } catch (_) {}
      })();
    </script>
