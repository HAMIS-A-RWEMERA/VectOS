[build]
  command = "npm run build"
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["views/**", "public/**", "supabase-schema.sql"]

[functions.server]
  external_node_modules = ["pg", "bcryptjs", "connect-pg-simple", "ejs", "express", "sql.js", "xlsx"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
