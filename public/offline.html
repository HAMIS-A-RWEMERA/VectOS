<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — VectOS</title>
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>:root{--c-app:#0A0C0F;--c-panel:#13161C;--c-border:#222732;} body{background:var(--c-app)}</style>
</head>
<body class="h-full flex items-center justify-center font-sans text-slate-200 px-4">
  <div class="w-full max-w-md bg-[var(--c-panel)] border border-[var(--c-border)] rounded-2xl p-8 shadow-2xl text-center space-y-4">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-sky-500/10 border border-sky-500/30 text-sky-400">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3"/></svg>
    </div>
    <h1 class="text-xl font-extrabold text-white">You are offline</h1>
    <p class="text-xs text-slate-400 leading-relaxed">
      No internet connection right now.
    </p>
    <div class="text-left p-4 rounded-xl bg-white/5 border border-white/10 text-xs text-slate-300 space-y-1.5">
      <p class="font-bold text-amber-400">Good to know:</p>
      <p>&bull; Sales recorded in the New Order screen are saved on this device and sent automatically once you reconnect.</p>
      <p>&bull; Everything you already loaded stays available until you close the page.</p>
    </div>
    <button onclick="location.reload()"
      class="w-full py-3 rounded-xl bg-gradient-to-r from-amber-400 to-amber-600 text-slate-950 font-extrabold text-sm cursor-pointer">
      Try Again
    </button>
  </div>
</body>
</html>
