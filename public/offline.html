<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — VectOS</title>
  <!-- Self-contained: no CDNs, so this page always renders even fully offline -->
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0A0C0F; color: #e2e8f0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; padding: 24px;
    }
    .card {
      width: 100%; max-width: 420px; background: #13161C; border: 1px solid #222732;
      border-radius: 16px; padding: 32px 28px; text-align: center;
    }
    .icon {
      display: inline-flex; align-items: center; justify-content: center;
      width: 56px; height: 56px; border-radius: 16px; font-size: 26px;
      background: rgba(14,165,233,.12); border: 1px solid rgba(14,165,233,.35); margin-bottom: 16px;
    }
    h1 { font-size: 20px; color: #fff; margin-bottom: 6px; }
    p.sub { font-size: 12px; color: #94a3b8; margin-bottom: 18px; }
    .note {
      text-align: left; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px; padding: 14px 16px; font-size: 12.5px; line-height: 1.7; color: #cbd5e1;
    }
    .note strong { color: #fbbf24; display: block; margin-bottom: 4px; }
    button {
      width: 100%; margin-top: 18px; padding: 13px; border: 0; border-radius: 12px;
      background: linear-gradient(90deg,#fbbf24,#d97706); color: #0f172a;
      font-weight: 800; font-size: 14px; cursor: pointer;
    }
    .brand { margin-top: 16px; font-size: 11px; color: #64748b; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You are offline</h1>
    <p class="sub">No internet connection right now.</p>
    <div class="note">
      <strong>Good to know</strong>
      &bull; Sales you recorded in the New Order screen are saved on this device and will be sent automatically once you reconnect.<br>
      &bull; Pages you already opened stay viewable until you close the app.
    </div>
    <button onclick="location.reload()">Try Again</button>
    <p class="brand">VectOS — Depot ERP</p>
  </div>
</body>
</html>
